<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Site en maintenance - SARAKI">
  <title>Maintenance - SARAKI</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --noir-charbon: #0A0A0A;
      --or-metallique: #D4AF37;
      --beige-ecru: #F5F1E8;
      --blanc: #FFFFFF;
      --font-titre: 'Playfair Display', serif;
      --font-texte: 'Montserrat', sans-serif;
    }
    
    body {
      font-family: var(--font-texte);
      background: linear-gradient(135deg, var(--noir-charbon) 0%, #1a1a1a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .maintenance-container {
      max-width: 600px;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 3rem;
      border-radius: 8px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      backdrop-filter: blur(10px);
    }
    
    .logo {
      margin-bottom: 2rem;
    }
    
    .logo img {
      width: 80px;
      height: 80px;
    }
    
    .maintenance-icon {
      font-size: 5rem;
      margin-bottom: 2rem;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.1);
        opacity: 0.8;
      }
    }
    
    .maintenance-title {
      font-family: var(--font-titre);
      font-size: 2.5rem;
      color: var(--or-metallique);
      margin-bottom: 1rem;
    }
    
    .maintenance-message {
      color: var(--beige-ecru);
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 2rem;
      opacity: 0.9;
    }
    
    .maintenance-info {
      background: rgba(212, 175, 55, 0.1);
      padding: 1.5rem;
      border-radius: 4px;
      margin-bottom: 2rem;
      border-left: 3px solid var(--or-metallique);
    }
    
    .maintenance-info p {
      color: var(--beige-ecru);
      margin-bottom: 0.5rem;
    }
    
    .maintenance-info strong {
      color: var(--or-metallique);
    }
    
    .contact-btn {
      display: inline-block;
      background-color: var(--or-metallique);
      color: var(--noir-charbon);
      padding: 1rem 2rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    .contact-btn:hover {
      background-color: #c9a227;
      transform: translateY(-2px);
    }
    
    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(212, 175, 55, 0.2);
      border-radius: 2px;
      margin-top: 2rem;
      overflow: hidden;
    }
    
    .progress-bar::after {
      content: '';
      display: block;
      width: 60%;
      height: 100%;
      background: var(--or-metallique);
      border-radius: 2px;
      animation: progress 2s ease-in-out infinite;
    }
    
    @keyframes progress {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }
  </style>
</head>
<body>
  <div class="maintenance-container">
    <div class="logo">
      <img src="../assets/logo.svg" alt="SARAKI Logo">
    </div>
    
    <div class="maintenance-icon">✨</div>
    
    <h1 class="maintenance-title">Site en Maintenance</h1>
    
    <p class="maintenance-message">
      Nous améliorons notre boutique en ligne pour vous offrir une expérience encore plus exceptionnelle.
      Le site sera de nouveau disponible très prochainement.
    </p>
    
    <div class="maintenance-info">
      <p><strong>⏱️ Durée estimée :</strong> Quelques heures</p>
      <p><strong>📅 Date de retour :</strong> Aujourd'hui</p>
      <p><strong>📧 Contact :</strong> contact@saraki.ne</p>
    </div>
    
    <a href="mailto:contact@saraki.ne" class="contact-btn">Nous Contacter</a>
    
    <div class="progress-bar"></div>
  </div>
</body>
</html>
